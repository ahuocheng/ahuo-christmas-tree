      y:height*.52+((focus-y)-depth*.18)*scale*perspective,z:depth,s:scale*perspective};
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);
  const t = reducedMotion ? 0 : now/1000;
  glow(width*.49,height*.43,Math.max(width,height)*.58,"#437f5f49");

    ctx.beginPath(); ctx.arc(x,y,p.r,0,TAU);ctx.fill();

  ctx.save();ctx.translate(ground.x,ground.y);ctx.scale(1,.24);
  glow(0,0,124*scale,"#b4d0b77a"); glow(0,8,82*scale,"#020a07aa");
  ctx.restore();
  const foot=project({x:0,y:0,z:0}), trunk=project({x:0,y:35,z:0});
  ctx.strokeStyle="#5c392b";ctx.lineWidth=13*scale;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(foot.x,foot.y);ctx.lineTo(trunk.x,trunk.y);ctx.stroke();

  const layers=[];
  for (const v of needles) layers.push({type:"needle",v,p:project(v)});
  for (const v of baubles) layers.push({type:"ball",v,p:project(v)});
  for (const v of gifts) layers.push({type:"gift",v,p:project(v)});
  for (let i=0;i<rungs.length;i++) {
    const p=project(rungs[i]);
    layers.push({type:"rung",v:i,p});
    if(i) layers.push({type:"wire",v:i,p,q:project(rungs[i-1])});
  }
  layers.sort((a,b)=> a.p.z-b.p.z);
  for(const {type,v,p,q} of layers) {
    const {x,y,s,z}=p;
    if(y < -48 || y > height+48) continue;
    if(type==="needle") {
      const length=v.size*s, side=Math.sin(v.a+yaw), lateral=side*length*.82;
      const toneIndex = Math.floor(v.shade*3+1.6+(z/105)*1.9);
      const tone = greens[Math.max(0, Math.min(5, toneIndex))];
      ctx.beginPath();ctx.moveTo(x-lateral*.46,y-length*.75);
      ctx.quadraticCurveTo(x+length*.79,y-length*.43,x+lateral,y+length*.48);
      ctx.quadraticCurveTo(x-length*.83,y+length*.28,x-lateral*.46,y-length*.75);
      ctx.fillStyle=tone[1];ctx.fill();
      ctx.beginPath();ctx.moveTo(x-lateral*.42,y-length*.73);
      ctx.quadraticCurveTo(x+length*.52,y-length*.60,x+lateral,y+length*.29);
      ctx.quadraticCurveTo(x-length*.67,y+length*.12,x-lateral*.42,y-length*.73);
      ctx.fillStyle=tone[0];ctx.fill();
      if(v.frost && z>-25) {
        ctx.strokeStyle="#b6dbbc5e";ctx.lineWidth=Math.max(.6,s*.78);
        ctx.beginPath();ctx.moveTo(x-lateral*.39,y-length*.66);ctx.quadraticCurveTo(x+length*.08,y-length*.52,x+lateral*.76,y+length*.15);ctx.stroke();
      }
    } else if(type==="ball") {
      const r=v.size*s;
      ctx.drawImage(sprites[v.color],x-r,y-r,r*2,r*2);
      ctx.fillStyle="#edcd83";ctx.fillRect(x-r*.25,y-r*1.07,r*.5,r*.28);

      ctx.lineWidth=v<=level?1.9:1.05;
      ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(x,y);ctx.stroke();
    } else if(type==="rung") {

  const starSize=Math.max(11,12.7*top.s);
  glow(top.x,top.y,starSize*(level===100?5.5:3.1),"#ffbf5675");
  star(top.x,top.y,starSize,-Math.PI/2+Math.sin(t*.88)*.21);
  const player=project(rung(visualLevel));
  const visiblePlayers = scenePlayers.map(row => {
    row.shownScore += (row.score-row.shownScore)*ease;
    return {...row, point:project(rung(row.shownScore))};
  });
  const friendMarkers = visiblePlayers.filter(row=>row.id!==game?.id)
    .filter(({point})=>point.y>54 && point.y<height-23)
    .sort((a,b)=>Math.abs(a.point.y-height*.5)-Math.abs(b.point.y-height*.5) || a.id.localeCompare(b.id)).slice(0,9);
  const occupied = [];
  if(game && (manualFocus===null || (player.y>52 && player.y<height-10))) {
    drawPlayer(game.id,game.name,player,true,t,occupied);
  }
  for(const row of friendMarkers) drawPlayer(row.id,row.nickname,row.point,false,t,occupied);

  const age=(now-burstAt)/1000;
  if (!reducedMotion && age<1.4) {
    ctx.globalAlpha=Math.max(0,1-age/1.4);ctx.fillStyle="#ffe5aa";
    for (const p of burst) {
      ctx.beginPath();ctx.arc(player.x+p.x*age,player.y+p.y*age+52*age*age,p.r,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

let audio, musicBus, effectsBus, soundtrackTimer;
let beatIndex = 0, nextBeat = 0;
const beatLength = 60/96;
const phrases = [
  {bass:48,chord:[60,64,67,71],melody:[76,null,79,81,79,null,76,74]},
  {bass:45,chord:[57,60,64,67],melody:[72,null,76,null,79,76,74,null]},
  {bass:41,chord:[57,60,65,69],melody:[72,null,77,79,81,null,79,77]},
  {bass:43,chord:[55,59,62,65],melody:[74,null,79,null,77,74,71,null]},
  {bass:48,chord:[60,64,67,71],melody:[72,76,79,null,83,null,81,79]},
  {bass:40,chord:[55,59,60,64],melody:[76,null,74,72,71,null,74,null]},
  {bass:41,chord:[57,60,65,69],melody:[77,null,81,79,76,null,74,72]},
  {bass:43,chord:[55,59,62,67],melody:[71,74,79,null,74,null,72,null]}

function tone(bus, midi, at, seconds, volume, wave="sine", overtone=false) {
  const oscillator=audio.createOscillator();
  const envelope=audio.createGain();
  oscillator.type=wave;
  oscillator.frequency.value=440*2**((midi-69)/12);
  envelope.gain.setValueAtTime(.0001,at);
  envelope.gain.exponentialRampToValueAtTime(volume,at+.025);
  envelope.gain.exponentialRampToValueAtTime(.0001,at+seconds);
  oscillator.connect(envelope);
  envelope.connect(bus);
  oscillator.start(at);
  oscillator.stop(at+seconds+.03);
  if(overtone) tone(bus,midi+12,at,seconds*.48,volume*.15);
}
function scheduleMusic() {
  if(audio?.state!=="running" || !soundEnabled || document.hidden) return;
  nextBeat=Math.max(nextBeat,audio.currentTime+.028);
  while(nextBeat<audio.currentTime+.24) {
    const bar=phrases[Math.floor(beatIndex/8)%phrases.length];
    const eighth=beatIndex%8;
    const melody=bar.melody[eighth];
    if(melody!==null) tone(musicBus,melody,nextBeat,.68,.054,"sine",true);
    if(eighth%2===0) tone(musicBus,bar.chord[eighth/2],nextBeat,.85,.034,"sine",true);
    if(eighth===0 || eighth===4) tone(musicBus,bar.bass+(eighth===4?7:0),nextBeat,1.16,.06);
    beatIndex=(beatIndex+1)%(phrases.length*8);
    nextBeat+=beatLength/2;
  }
}
function paintSoundButton() {

function stopSound() {

function wakeSound() {
  if(!soundEnabled || document.hidden) return;
  try {
    if(!audio) {
      const Context=window.AudioContext||window.webkitAudioContext;
      if(!Context) return;
      audio=new Context();
      musicBus=audio.createGain();
      effectsBus=audio.createGain();
      musicBus.gain.value=.35;
      effectsBus.gain.value=.56;
      musicBus.connect(audio.destination);
      effectsBus.connect(audio.destination);
    }
    if(audio.state!=="running") void audio.resume().then(scheduleMusic).catch(()=>{});
    if(!soundtrackTimer) soundtrackTimer=setInterval(scheduleMusic,100);
  } catch {}
}
function playSound(kind) {
  wakeSound();
  if(!audio || !soundEnabled || document.hidden) return;
  const notes={
    select:[[77,0,.13,.065]],
    correct:[[84,.09,.30,.10],[88,.18,.36,.078],[91,.27,.48,.062]],
    wrong:[[70,.11,.26,.076],[65,.24,.34,.055]],

    duel:[[69,0,.24,.075],[76,.12,.31,.069]]

  const now=audio.currentTime+.028;
  for(const [note,offset,len,volume] of notes[kind]) tone(effectsBus,note,now+offset,len,volume,"sine",true);
}

async function playDuel(hand) {
  if(!game || game.done || !opponent || duelBusy || resolvedDuel) return;
  duelBusy=true;
  playSound("select");
  const rival=opponent;
  $("dismiss-duel").disabled=true;
  const actions=[...$("duel-actions").children];
  actions.forEach(button=>{button.disabled=true;});
  try {
    let other=rival.hand;
    if(cloudEnabled && rival.has_hand) {
      const client=await connect();
      const {data,error}=await client.rpc("christmas_reveal_hand",{
        opponent_id:rival.id,room_code:roomCode,rung_height:game.score
      });
      if(error) throw error;
      other=data;
    }
    if(!validHand(other)) throw Error("Missing hand");
    const won=(other-hand+3)%3===1;
    const draw=other===hand;
    if(!draw) playSound(won?"correct":"wrong");
    const next=game.index+Number(game.selected!==null);
    const skipped=won?Math.min(5,100-next):0;
    resolvedDuel=true;
    game.duels=[...(game.duels||[]),game.score];
    if(skipped) {
      game.index=Math.min(99,next+skipped);
      game.selected=null;
      game.done=next+skipped===100;
      if(game.done) resetCamera();
      makeBurst(true);
    }
    persist(Boolean(skipped));
    if(!skipped) renderBoard();
    repaint();
    $("duel-title").textContent=won?"对决获胜！":draw?"打成平手":"对手获胜";
    $("duel-copy").textContent=skipped?"已跳过 "+skipped+" 题 · 高度保持不变":
      won?"本轮题目已答完":"继续攀登";
    const vs=document.createElement("strong");
    vs.textContent="VS";
    $("duel-outcome").replaceChildren(outcomeSide("你",hand),vs,outcomeSide(rival.nickname,other));
    $("duel-outcome").hidden=false;
    $("duel-actions").hidden=true;
    $("duel-continue").hidden=false;
    $("duel-continue").focus();
  } catch {
    $("duel-copy").textContent="暂时无法揭晓，请再试一次。";
    actions.forEach(button=>{button.disabled=false;});
  } finally {

  }
}

    const place = document.createElement("span");
    place.className="rank"; place.textContent=String(rank).padStart(2,"0");
    const label = document.createElement("span");
    const avatar = document.createElement("span");
    avatar.className="animal-inline"; avatar.setAttribute("aria-hidden","true"); avatar.textContent=animal(row.id).icon;
    label.append(avatar, document.createTextNode(row.nickname + (row.id===game?.id ? "（你）" : "")));
    const score = document.createElement("b");
    score.textContent=row.score + " 格";
    item.append(place,label,score);
    return item;
  });
  $("board-list").replaceChildren(...items);
}

async function connect() {
  if (cloud) return cloud;
  if (!cloudPending) {
    cloudPending = (async () => {
      const {createClient} = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      const client = createClient(CLOUD.url,CLOUD.publishableKey);
      const session = await client.auth.getSession();
      if(session.error) throw session.error;
      if (!session.data.session) {
        const result = await client.auth.signInAnonymously();
        if(result.error) throw result.error;
      }
      cloud = client;
      return cloud;
    })().finally(()=>{ cloudPending=null; });
  }
  return cloudPending;
}
async function syncScore() {
  if (!cloudEnabled || syncing || !game) return;
  syncing = true;
  try {
    const client = await connect();
    const {data} = await client.auth.getSession();
    if (!data.session) throw new Error("Session unavailable");
    while (game) {
      const sending = revision;
      const {hand, ...climb} = currentRow();
      const row = {...climb, owner: data.session.user.id};
      const {error} = await client.from("christmas_climbs").upsert(row);
      if (error) throw error;
      if (validHand(hand)) {
        const {error:handError} = await client.rpc("christmas_save_hand",{climb_id:row.id,new_hand:hand});
        if(handError) throw handError;
      }
      if (sending === revision) break;
    }
    $("sync-notice").hidden = true;
    if (board.open || game?.done) void refreshScores();
  } catch {
    $("sync-notice").hidden = false;
  } finally { syncing = false; }
}
async function refreshScores() {
  if (!cloudEnabled) return;
  const request = ++boardRevision;
  try {
    const client = await connect();
    const {data,error} = await client.from("christmas_climbs").select("id,nickname,score,answered,finished,has_hand")
      .eq("room",roomCode).order("score",{ascending:false}).order("id").limit(1000);
    if (error) throw error;
    if (request !== boardRevision) return;
    cloudScores = data;
  } catch {
    if (request !== boardRevision) return;
    cloudScores = null;
  }
  renderBoard();
}
function openBoard() {
  if (!board.open) board.showModal();
  renderBoard();
  void watchScores();
}
async function watchScores() {
  if (!cloudEnabled) return;
  void refreshScores();
  try {
    const client = await connect();
    if(leaderboardChannel) return;
    leaderboardChannel = client.channel("christmas-" + roomCode).on("postgres_changes", {
      event: "*", schema:"public", table:"christmas_climbs", filter:"room=eq." + roomCode
    }, () => {
      clearTimeout(boardTimer);
      boardTimer = setTimeout(refreshScores,220);
    }).subscribe(status=>{
      if (status==="SUBSCRIBED") void refreshScores();
    });
  } catch { renderBoard(); }
}
$("start-form").addEventListener("submit",e=>{
  e.preventDefault();
  const name = $("nickname").value.trim();
  if (!name) {
    $("nickname").setCustomValidity("请输入昵称");
    $("nickname").reportValidity();
    return;
  }
  const id = crypto.randomUUID ? crypto.randomUUID() :
    [...crypto.getRandomValues(new Uint8Array(16))].map((n,i)=>
      ([4,6,8,10].includes(i)?"-":"")+(i===6?((n&15)|64):i===8?((n&63)|128):n).toString(16).padStart(2,"0")).join("");
  game={id,name,index:0,selected:null,score:0,done:false};
  playSound("select");
  resetCamera();
  persist(true); repaint();
  $("question").focus({preventScroll:true});
});
$("nickname").addEventListener("input", ()=>$("nickname").setCustomValidity(""));
function queueNext() {
  clearTimeout(nextTimer);
  if (duel.open || !game || game.done || game.selected === null) return;
  const correct = game.selected === QUESTIONS[game.index].answer;
  nextTimer = setTimeout(advance, correct ? 650 : 900);
}
function advance(){
  if(duel.open || !game || game.selected===null || game.done) return;
  if(game.index===99) {
    game.done=true;
    playSound("complete");
    resetCamera();
    persist(true); repaint();
    if(!board.open) $("result-title").focus({preventScroll:true});
    if (game.score===100) makeBurst(true);
    if (cloudEnabled) void refreshScores();
    return;
  }
  game.index++;
  game.selected=null;
  persist(); repaint();
  if(!board.open) $("question").focus({preventScroll:true});
}
$("restart").addEventListener("click",()=>{
  $("nickname").value=game.name;
  game=null;
  resetCamera();
  persist(); repaint();
  $("nickname").focus({preventScroll:true});
});
$("retry").addEventListener("click",()=>void syncScore());
$("open-board").addEventListener("click",openBoard);
$("result-board").addEventListener("click",openBoard);
$("close-board").addEventListener("click",()=>board.close());

addEventListener("online",()=>{ void syncScore(); void watchScores(); });
addEventListener("storage",event=>{
  if(event.key===boardKey) { localScores=load(boardKey,[]); renderBoard(); }
});
if (game && !game.done && game.selected !== null) {
  if(game.index===QUESTIONS.length-1) {
    game.done=true;
    persist(true);
  } else {
    game.index++;
    game.selected=null;
    persist();
  }
}
if (game) visualLevel=game.score;
repaint();
renderBoard();
queueNext();
if (cloudEnabled) { void watchScores(); if(game) void syncScore(); }
requestAnimationFrame(animate);
</script>
</body>
</html>
